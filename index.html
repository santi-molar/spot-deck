 n.style.background="radial-gradient(ellipse at 25% 15%,rgba("+c1+",.6),transparent 65%),radial-gradient(ellipse at 85% 95%,rgba("+c2+",.45),transparent 60%)";n.style.opacity=1;o.style.opacity=0;
